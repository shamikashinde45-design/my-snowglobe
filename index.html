<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Mystical Snowglobe</title>
         <link rel ="stylesheet" href="style.css"/>
         <link href="https://fonts.cdnfonts.com/css/homestead" rel="stylesheet">
                
    </head>
      <body>
        <header class="home">
       <h1><i>My snowglobe</i></h1> 
        <p class="taglinge">Winter is incomplete without gift. Try shaking this gift of yours.</p>  
        </header>
        <main>
            <section class="globe-card">

                <div class="globe" id="globe">
                    <img class="scene" src="snowglobe.png"alt=" a snowglobe"/>
                </div>
                 <button id="shake">shake the globe!</button>
                 <h3 class="message">press the button and see what happens ~ ></h3>
                
            </section>
        </main>
         <footer>
            <h3 class="name">Created by shamika for you!</h3>
         </footer>
         <script src="script.js"></script>
      </body>
    
</html>
